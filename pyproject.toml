[tool.poetry]
name = "beqdesigner"
version = "2.0.10"
description = "A Qt based app for designing BassEQ filters"
authors = ["3ll3d00d <mattkhan+beqdesigner@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://beqdesigner.readthedocs.io/"
repository = "https://github.com/3ll3d00d/beqdesigner"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
pyqt6 = "^6.10"
ffmpeg-python = "^0.2"
soundfile = "^0.13"
pyqtgraph = "^0.14"
numpy = "^2.4"
scipy = "^1.17"
qtpy = "^2.4"
qtawesome = "^1.4"
sortedcontainers = "^2.4"
pillow = "^12.1"
requests = "^2.32"
awesomeversion = "^25.8"
markdown = "^3.10"
plumbum = "^1.10"
graphviz = "^0.21"
sanitize-filename = "^1.2"
matplotlib = "^3.10"
soxr = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-cov = "^7.0"
distro = "^1.9"
atomicwrites = "^1.4"
scipy-stubs = "^1.17"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
