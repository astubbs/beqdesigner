name: run tests
on:
  push:
    branches:
      - '*'
    paths:
      - 'src/main/python/**'
      - 'src/test/**'
      - 'scripts/**'
      - 'poetry.lock'
      - 'test.yaml'
  pull_request:
    branches:
      - '*'
    paths:
      - 'src/main/python/**'
      - 'src/test/**'
      - 'scripts/**'
      - 'poetry.lock'
      - 'test.yaml'
  workflow_dispatch:
    branches:
      - '*'
defaults:
  run:
    shell: bash
jobs:
  # --- Code quality gates (PR only) ---

  duplicate-detection:
    if: github.event_name == 'pull_request'
    name: Duplicate Code Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astubbs/duplicate-code-cross-check@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          directories: 'src/main/python src/test/python'
          cpd-max-duplication: '5'
          jscpd-max-duplication: '4'

  file-similarity:
    if: github.event_name == 'pull_request'
    name: File Similarity Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astubbs/duplicate-code-detection-tool@feat/base-vs-pr-comparison
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          directories: 'src/main/python,src/test/python'
          file_extensions: 'py'
          ignore_below: 30
          fail_above: 80
          warn_above: 50
          one_comment: true
          compare_with_base: true
          max_increase: 10

  # --- Existing jobs ---

  ui-sync-check:
    name: Qt .ui -> .py drift check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true
      - name: Install minimal deps for pyuic6
        run: poetry install --no-interaction --only main
      - name: Regenerate UI
        run: poetry run python scripts/regen_ui.py
      - name: Fail if generated files drifted
        run: git diff --exit-code src/main/python/ui/

  lint:
    name: ruff + mypy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true
      - name: Install dev deps
        run: poetry install --no-interaction --only main,dev
      - name: ruff
        run: poetry run ruff check src/main/python
      - name: mypy
        run: poetry run mypy

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04, macos-14, macos-15, macos-26, windows-2022, windows-2025 ]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction
      - name: Install project
        run: poetry install --no-interaction
      - name: Install test dependencies
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]
          then
            sudo apt install -y libegl1
          fi
      - name: pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Exclude spike tests marked `integration` (need real media / TMDb /
          # Ollama) and `experiment` (retrain models, minutes-to-hours each).
          # Both groups are opt-in via scripts/run-spike-{integration,experiments}.sh.
          PYTHONPATH=./src/main/python poetry run pytest --cov=./src/main/python \
            -m "not integration and not experiment"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Install packaging dependencies
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]
          then
            sudo apt install -y libblas-dev liblapack-dev libsndfile1 graphviz
            sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0 libxcb-util1 libxcb-xkb1 libxcb-shape0 libegl1 
          elif [[ "$RUNNER_OS" == "Windows" ]]
          then
            choco install openssl.light graphviz
          elif [[ "$RUNNER_OS" == "macOS" ]]
          then
            brew install graphviz
            brew ls -v graphviz
          fi
          poetry run pip install pyinstaller
      - name: Get version
        id: get_version
        run: echo "name=sha_short::$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Append version
        run: |
          echo ${{ steps.get_version.outputs.sha_short }} > src/main/python/VERSION
      - name: Create distribution
        run: |
          export QT_DEBUG_PLUGINS=1
          export DISPLAY=:0
          sudo /usr/bin/Xvfb $DISPLAY -screen 0 1280x1024x24 &
          poetry run pyinstaller --clean --log-level=INFO beqdesigner.spec
          if [[ "$RUNNER_OS" == "macOS" ]]
          then
            pushd dist
            rm beqdesigner
            zip -r beqdesigner.app.${{ matrix.os }}.zip beqdesigner.app
            rm -Rf beqdesigner.app
            popd
          fi
      - name: Archive app binaries
        uses: actions/upload-artifact@v4
        with:
          name: beqdesigner-apps-${{matrix.os}}
          path: |
            dist/beqdesigner.exe
            dist/beqdesigner*.zip
            dist/beqdesigner_*
          retention-days: 1
