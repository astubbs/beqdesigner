# BEQ Designer — docker-compose configuration
#
# Copy this file to docker-compose.yml and edit the volume paths to match
# your NAS/server layout. Then run:
#
#   docker compose run beq-designer                 # Interactive menu
#   docker compose run beq-designer extract        # Extract LFE WAVs
#   docker compose run beq-designer --help         # List all subcommands
#
# The extractor runs breadth-first: alternates movies and TV, one episode
# per show per round. Already-extracted titles are skipped instantly. Safe
# to interrupt and re-run — atomic writes prevent corrupt WAVs.

services:

  beq-designer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: beq-designer:latest
    container_name: beq-designer
    stdin_open: true
    tty: true
    volumes:
      # BEQ working directory — stores config, catalogue cache, WAV output,
      # and media_inventory.json. WAVs go in {beq-dir}/wav-cache/ automatically.
      - "/volume3/jetspeed/beqdesigner:/beq"

      # Media libraries (read-only). Add or remove as needed.
      # The container path (/media/...) is what you pass to --media-root.
      - "/volume1/media/Movies:/media/Movies:ro"
      - "/volume1/media/TV:/media/TV:ro"
      - "/volume2/media/Anime Movies:/media/Anime_Movies:ro"
      - "/volume2/media/Anime TV:/media/Anime_TV:ro"

    # No default command — launches the interactive menu.
    # Pass subcommands directly: docker compose run beq-designer extract ...
